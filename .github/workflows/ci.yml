name: Pull request - CI

on:
  workflow_dispatch:
  push:
    paths:
     - 'src/**'
    branches: [ main ]

  pull_request:
    paths:
     - 'src/**'
    branches: [ main ]

permissions:
  contents: write
  security-events: write
  actions: read
  packages: read
  pull-requests: write

jobs:
  SAST:
    name: SAST - codeql
    runs-on: ubuntu-latest

    strategy:
          fail-fast: false
          matrix:
            include:
            - language: python
              build-mode: none
            
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
  
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
          upload: true

  SCA:
    name: SCA - Python dependencies
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # En PR: compara las dependencias nuevas contra main
      - name: Dependency Review (PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          # fail-on-severity: high
          warn-only: true
          comment-summary-in-pr: true
          vulnerability-check: true

      # En ejecución manual: escanea todas las dependencias actuales (requirements.txt)
      - name: Dependency Scan (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: anchore/scan-action@v6
        id: sca_scan
        with:
          path: src
          fail-build: false
          severity-cutoff: high

      - name: Upload SARIF (SCA)
        if: always() && github.event_name == 'workflow_dispatch' && steps.sca_scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.sca_scan.outputs.sarif }}
          category: sca-python

  Container_security:
    name: Dockerfile Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Build image
        run: |
          docker build -f src/Dockerfile -t test-image src/

      - name: Image Scan
        uses: anchore/scan-action@v6
        id: scan
        with:
          image: test-image
          fail-build: false
          severity-cutoff: high

      - name: Upload sarif
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
